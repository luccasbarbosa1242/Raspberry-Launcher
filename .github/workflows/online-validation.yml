name: Online accounts validation

on:
  push:
    branches:
      - codex/phase-2-online-accounts
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local_ci_only
      PGDATABASE: postgres
      PYTHONPYCACHEPREFIX: /tmp/raspberry-pycache-online
      RASPBERRY_LAUNCHER_HOME: /tmp/raspberry-online-ci-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth python3-tk postgresql-client
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
          python -m pip check
      - name: Compile and lint
        run: |
          python -m compileall -q backend frontend application contracts tests main.py
          ruff check .
      - name: Execute PostgreSQL security and RPC smoke tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_smoke.sql
      - name: Full suite (real CustomTkinter)
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Rehearse point and restore in fresh folders
        run: |
          python -m backend init
          python -m backend.tools.create_recovery_point --home /tmp/raspberry-online-ci-runtime --destination /tmp/online-recovery-point
          python -m backend.tools.restore_recovery_point --recovery-point /tmp/online-recovery-point --destination /tmp/online-restored-runtime

  cleanup-merged-branches:
    name: Remove merged development branches
    needs: online-validation
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'chore: consolidate all development branches')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every branch was merged before deleting any
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'codex/phase-1-catalogs'
            'codex/phase-2-local-profiles'
            'codex/phase-2-online-accounts'
            'master'
          )
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in "${branches[@]}"; do
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            git cat-file -e "${remote_sha}^{commit}"
            if ! git merge-base --is-ancestor "$remote_sha" HEAD; then
              echo "::error::Refusing to delete $branch: $remote_sha is not part of main"
              exit 1
            fi
            echo "Preserved in main history: $branch @ $remote_sha"
          done
          for branch in "${branches[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted merged branch: $branch"
          done
          remaining="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          if [[ "$remaining" != "main" ]]; then
            echo "::error::Unexpected remaining branches: $remaining"
            exit 1
          fi
          echo 'Only main remains; all retired branch commits are in main history.'
