name: T02 validation

on:
  push:
    branches:
      - codex/phase-2-local-profiles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/launcher-pycache
      RASPBERRY_LAUNCHER_HOME: ${{ runner.temp }}/launcher-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth python3-tk
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
          python -m pip check
      - name: Compile and lint
        run: |
          python -m compileall -q backend frontend application contracts tests main.py
          ruff check .
      - name: Full Tk/Xvfb test suite
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Recovery rehearsal on isolated runtime
        run: |
          python -m backend init
          python -m backend.tools.create_recovery_point \
            --home "$RASPBERRY_LAUNCHER_HOME" \
            --destination "${RUNNER_TEMP}/phase2-recovery"
          python -m backend.tools.restore_recovery_point \
            --recovery-point "${RUNNER_TEMP}/phase2-recovery" \
            --destination "${RUNNER_TEMP}/phase2-restored"
